
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.0";

const SUPABASE_URL = "https://bydkbesdjrfcrsivmoru.supabase.co";
const SUPABASE_KEY = "sb_publishable_ohiW4Aeg0fNe0SaQu2FFkQ_anz2PoAO";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let observationMap = null;
let observationMarker = null;
let discoveriesMap = null;
let discoveriesLayer = null;

/* =========================================================
   1. DATE AUTOMATIQUE
========================================================= */

const dateField = $("obs-datetime");

if (dateField && !dateField.value) {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

  dateField.value = now.toISOString().slice(0, 16);
}

/* =========================================================
   2. CARTE DE SELECTION DU LIEU
========================================================= */

function updateObservationPosition(latitude, longitude) {
  $("obs-latitude").value = latitude;
  $("obs-longitude").value = longitude;

  $("obs-location-status").textContent =
    "Position sélectionnée sur la carte.";

  if (observationMarker) {
    observationMarker.setLatLng([latitude, longitude]);
  } else {
    observationMarker = L.marker([latitude, longitude])
      .addTo(observationMap);
  }
}

function initializeObservationMap() {
  const mapContainer = $("obs-location-map");

  if (!mapContainer || typeof L === "undefined") {
    return;
  }

  observationMap = L.map(mapContainer).setView([46.5, 2.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap"
  }).addTo(observationMap);

  observationMap.on("click", event => {
    updateObservationPosition(
      event.latlng.lat,
      event.latlng.lng
    );
  });

  setTimeout(() => observationMap.invalidateSize(), 300);
}

/* =========================================================
   3. GEOLOCALISATION GPS
========================================================= */

const gpsButton = $("obs-geolocate");

if (gpsButton) {
  gpsButton.addEventListener("click", () => {
    if (!navigator.geolocation) {
      $("obs-location-status").textContent =
        "La géolocalisation n'est pas disponible sur cet appareil.";
      return;
    }

    $("obs-location-status").textContent =
      "Recherche de votre position GPS…";

    navigator.geolocation.getCurrentPosition(
      position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        if (!observationMap) {
          initializeObservationMap();
        }

        observationMap.setView([latitude, longitude], 14);

        updateObservationPosition(latitude, longitude);
      },

      error => {
        console.error("GPS :", error);

        $("obs-location-status").textContent =
          "Position inaccessible. Vous pouvez choisir le lieu directement sur la carte.";
      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

initializeObservationMap();

/* =========================================================
   4. CARTE DES DECOUVERTES
========================================================= */

function initializeDiscoveriesMap() {
  const container = $("community-map");

  if (!container || typeof L === "undefined") {
    return;
  }

  discoveriesMap = L.map(container).setView([46.5, 2.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap"
  }).addTo(discoveriesMap);

  discoveriesLayer = L.layerGroup().addTo(discoveriesMap);

  setTimeout(() => discoveriesMap.invalidateSize(), 300);
}

/* =========================================================
   5. CHARGEMENT DE LA CARTE PUBLIQUE OU PERSONNELLE
========================================================= */

async function loadDiscoveries(mode) {
  if (!discoveriesMap || !discoveriesLayer) {
    return;
  }

  discoveriesLayer.clearLayers();

  const status = $("community-map-status");

  status.textContent = "Chargement des découvertes…";

  let query = supabase
    .from("observations")
    .select(`
      id,
      observation_date,
      observed_at,
      description,
      approximate_location,
      latitude,
      longitude,
      visibility,
      status
    `);

  /* CARTE COMMUNAUTAIRE */
  if (mode === "public") {
    query = query
      .eq("visibility", "public")
      .eq("status", "approved");
  }

  /* CARTE PERSONNELLE */
  if (mode === "personal") {
    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError || !authData?.user) {
      status.textContent =
        "Connectez-vous pour consulter votre carte personnelle.";

      return;
    }

    query = query.eq("user_id", authData.user.id);
  }

  const { data, error } = await query
    .not("latitude", "is", null)
    .not("longitude", "is", null)
    .order("observation_date", {
      ascending: false
    })
    .limit(500);

  if (error) {
    console.error("Carte :", error);

    status.textContent =
      "Impossible de charger les découvertes. Vérifiez la connexion.";

    return;
  }

  if (!data || data.length === 0) {
    status.textContent =
      mode === "public"
        ? "Aucune découverte publique validée pour le moment."
        : "Votre carte personnelle ne contient aucune découverte géolocalisée.";

    return;
  }

  const coordinates = [];

  /* CREATION DES MARQUEURS */

  for (const observation of data) {
    const latitude = Number(observation.latitude);
    const longitude = Number(observation.longitude);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {
      continue;
    }

    const marker = L.marker([latitude, longitude]);

    const popup = document.createElement("div");

    const title = document.createElement("strong");

    title.textContent =
      observation.approximate_location ||
      "Découverte de champignon";

    const date = document.createElement("p");

    date.textContent = observation.observation_date
      ? new Date(
          observation.observation_date + "T12:00:00"
        ).toLocaleDateString("fr-FR")
      : "Date inconnue";

    const description = document.createElement("p");

    description.textContent =
      observation.description ||
      "Aucune description renseignée.";

    popup.appendChild(title);
    popup.appendChild(date);
    popup.appendChild(description);

    marker.bindPopup(popup);

    marker.addTo(discoveriesLayer);

    coordinates.push([latitude, longitude]);
  }

  if (coordinates.length > 0) {
    discoveriesMap.fitBounds(coordinates, {
      padding: [30, 30],
      maxZoom: 12
    });
  }

  status.textContent =
    coordinates.length +
    (mode === "public"
      ? " découverte(s) publique(s) validée(s)."
      : " découverte(s) dans votre carte personnelle.");
}

/* =========================================================
   6. BOUTONS DES CARTES
========================================================= */

const publicButton = $("show-public-map");
const personalButton = $("show-personal-map");

if (publicButton) {
  publicButton.addEventListener("click", () => {
    loadDiscoveries("public");
  });
}

if (personalButton) {
  personalButton.addEventListener("click", () => {
    loadDiscoveries("personal");
  });
}

/* =========================================================
   7. DEMARRAGE
========================================================= */

initializeDiscoveriesMap();

if (discoveriesMap) {
  loadDiscoveries("public");
}

</script>
